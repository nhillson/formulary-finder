name: Diagnostics
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch live site data samples
        run: |
          mkdir -p diag/out/live
          for f in index.json 2027/rx/2730167.json 2027/rx/2736946.json 2027/rx/2707553.json 2027/rx/2707551.json 2027/cost/MN.json; do
            curl -sSf "https://nhillson.github.io/formulary-finder/data/$f" -o "diag/out/live/$(echo $f | tr / _)" || echo "miss $f"
          done
      - run: python diag/diag2.py
      - name: Commit results
        run: |
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add diag/out; git commit -m "diag results" -q; git push origin HEAD:diag
